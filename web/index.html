<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TooruDragon v0.3.0</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      --bg:#0b0f14;
      --panel:#121923;
      --panel2:#17202b;
      --line:#273244;
      --text:#f4f7fb;
      --muted:#95a2b5;
      --good:#71e6a2;
      --bad:#ff7f87;
      --accent:#67d6ff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:
      radial-gradient(circle at top right,rgba(62,177,255,.12),transparent 34%),
      radial-gradient(circle at top left,rgba(120,90,255,.10),transparent 30%),
      var(--bg);color:var(--text);min-height:100vh}
    main{max-width:1100px;margin:0 auto;padding:34px 20px 60px}
    .hero{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:14px}
    .dragon{font-size:46px;filter:drop-shadow(0 0 18px rgba(103,214,255,.35))}
    h1{margin:0;font-size:34px;letter-spacing:.4px}
    .muted{color:var(--muted)}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(18,25,35,.8)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap}
    button{padding:10px 14px;border-radius:12px;border:1px solid #33445b;background:linear-gradient(180deg,#202b3a,#18212d);color:#fff;cursor:pointer;font-weight:600}
    button:hover{border-color:#4f6b8d;transform:translateY(-1px)}
    .section{margin-top:28px}
    .section h2{font-size:18px;margin:0 0 12px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
    .card{background:linear-gradient(180deg,rgba(23,32,43,.95),rgba(17,24,33,.95));border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 28px rgba(0,0,0,.18)}
    .core-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .core-name{font-weight:700;font-size:16px}
    .status{margin-top:14px;font-size:13px;font-weight:800;letter-spacing:.8px}
    .ok{color:var(--good)}
    .bad{color:var(--bad)}
    .meta{margin-top:8px;color:var(--muted);font-size:13px;line-height:1.6}
    code{color:#cfeeff}
    .footer{margin-top:28px;color:var(--muted);font-size:13px}
  </style>
</head>
<body>
<main>
  <div class="hero">
    <div class="brand">
      <div class="dragon">🐉</div>
      <div>
        <h1>TooruDragon</h1>
        <div class="muted">Русская панель управления • v0.3.0</div>
      </div>
    </div>
    <div class="toolbar">
      <span class="badge">🧠 Main <code>:8700</code></span>
      <span class="badge">🌐 Web <code>:8710</code></span>
      <button onclick="refreshStatus()">🔄 Обновить состояние</button>
    </div>
  </div>

  <div class="section">
    <h2>✨ Состояние ядер</h2>
    <div id="status" class="grid"></div>
  </div>

  <div class="footer">
    🛡 Watchdog следит за ядрами автоматически · 🧪 Проверки выполняются перед запуском · 💾 Система поддерживает переносной режим
  </div>
</main>
<script>
const names = {
  tooru_ai: ['🐉','Tooru/AI'],
  laboratory: ['🧪','Лаборатория Tooru/AI'],
  home: ['🏠','Домашнее ядро'],
  work: ['💼','Рабочее ядро'],
  mobile: ['📱','Мобильное ядро']
};

async function refreshStatus() {
  const root = document.getElementById('status');
  root.innerHTML = '<div class="card">🔎 Проверяю ядра...</div>';
  try {
    const res = await fetch('http://127.0.0.1:8700/cores', {cache:'no-store'});
    const data = await res.json();
    root.innerHTML = Object.entries(data.cores || {}).map(([name, state]) => {
      const ok = !!state.ok;
      const info = names[name] || ['⚙️', name];
      const payload = state.payload || {};
      return '<div class="card">' +
        '<div class="core-title"><div class="core-name">'+info[0]+' '+info[1]+'</div><span>'+(ok?'🟢':'🔴')+'</span></div>' +
        '<div class="status '+(ok?'ok':'bad')+'">'+(ok?'РАБОТАЕТ':'НЕДОСТУПНО')+'</div>' +
        '<div class="meta">Версия: <code>'+(payload.version || '—')+'</code><br>' +
        'HTTP: <code>'+(state.status_code || '—')+'</code></div>' +
      '</div>';
    }).join('');
  } catch (err) {
    root.innerHTML = '<div class="card bad">🔴 Главное ядро недоступно: '+err+'</div>';
  }
}
refreshStatus();
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
